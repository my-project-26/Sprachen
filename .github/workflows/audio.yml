name: Sprachaufnahmen erzeugen

# Erzeugt fehlende MP3-Aufnahmen (natürliche Stimme) für alle Wörter und
# Beispielsätze und legt sie im Ordner audio/ ab. Läuft automatisch, wenn
# sich Wortlisten ändern, und lässt sich unter „Actions“ auch von Hand starten.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Sprachen/Niveaus, z. B. en:A1 oder en es"
        default: "en:A1"
  push:
    branches: [main]
    paths:
      - "js/wordbank*.js"
      - "js/words.js"
      - "js/langs.js"
      - "tools/make-audio.py"
      - ".github/workflows/audio.yml"

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - name: Aufnahmen erzeugen
        env:
          AUDIO_MAX_MIN: "300"
          AUDIO_PARALLEL: "6"
        run: python tools/make-audio.py ${{ inputs.langs || 'en:A1' }}
      - name: Hochladen
        run: |
          git config user.name "wortwerk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Nichts Neues"; exit 0; fi
          git commit -q -m "Sprachaufnahmen aktualisiert"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
