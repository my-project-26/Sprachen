name: Google-Stimmen aufnehmen
# Nimmt alle Wörter und Beispielsätze mit den Google-Stimmen (Chirp 3 HD) auf.
# Ergebnis: audio/<lang>-<stimme>/ (sulafat = Frau 2, gacrux = Frau 3, charon = Mann 2, algenib = Mann 3).
# Kostenschutz: GTTS_CAP Zeichen pro Monat (voices/gtts-usage.json).
on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Stimmen, z. B. f2 f3 m2 m3"
        default: "f2 f3 m2 m3"
      lang:
        default: "en"
permissions:
  contents: write
concurrency:
  group: gtts
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
      - name: Aufnehmen
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GTTS_USAGE: voices/gtts-usage.json
          GTTS_CAP: "950000"
        run: |
          git config user.name "wortwerk-bot"; git config user.email "actions@users.noreply.github.com"
          L=${{ inputs.lang }}
          for v in ${{ inputs.voices }}; do
            D=$(python3 -c "print({'f2':'sulafat','f3':'gacrux','m2':'charon','m3':'algenib'}['$v'])")
            python3 tools/gtts.py run $v $L audio/$L-$D
            python3 tools/write-index.py audio $L
            git add audio/$L-$D audio/$L-*/index.json voices/gtts-usage.json
            git commit -q -m "Google-Stimme $D ($L)" || true
            for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 10; done
          done
